services:
  # Backend Laravel API
  - type: web
    name: actividades-backend
    env: docker
    repo: https://github.com/CarlosPinaB/FCT_CARLOSPI-A.git # Cambiar por tu repo
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_NAME
        value: "Sistema de Actividades Extraescolares"
      - key: APP_URL
        value: https://actividades-backend.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_STDERR_FORMATTER
        value: Monolog\Formatter\JsonFormatter
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: dpg-d112fn14d50c739udlj0-a
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: actividades_db
      - key: DB_USERNAME
        value: actividades_user
      - key: DB_PASSWORD
        value: grWSxu3tlzOEMggwCRgssjK44223hQVD
      - key: CACHE_DRIVER
        value: array
      - key: SESSION_DRIVER
        value: cookie
      - key: SESSION_LIFETIME
        value: 120
      - key: QUEUE_CONNECTION
        value: sync
      - key: SANCTUM_STATEFUL_DOMAINS
        value: "actividades-frontend.onrender.com,localhost:3000"
      - key: SESSION_DOMAIN
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://actividades-frontend.onrender.com,http://localhost:3000"

# Base de datos MySQL
databases:
  - name: actividades-db
    databaseName: actividades_db
    user: actividades_user
    plan: free
